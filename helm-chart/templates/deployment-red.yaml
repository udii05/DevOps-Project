apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-red
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: app
      version: red
  template:
    metadata:
      labels:
        app: app
        version: red
    spec:
      containers:
        - name: app-red
          image: {{ .Values.appRed.image }}
          imagePullPolicy: Always
          ports:
            - containerPort: {{ .Values.app.port }}
