apiVersion: v1
kind: Service
metadata:
  name: app-service-blue
spec:
  selector:
    app: app
    version: blue
  ports:
    - name: http
      port: {{ .Values.appBlue.port }}
      protocol: TCP

---

apiVersion: v1
kind: Service
metadata:
  name: app-service-red
spec:
  selector:
    app: app
    version: red
  ports:
    - name: http
      port: {{ .Values.appRed.port }}
      protocol: TCP
