name: Helm Packaging and Release

on:
  workflow_run:
    workflows: [Docker Image CD - Deploy]
    types:
      - completed

env:
  CHART_DIR: helm-chart

jobs:

  Helm-Build-Package:
    runs-on: [ ubuntu-latest ]

    steps:
    # Step 1: Checkout the code
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Determine the semantic version
    - name: Determine Version
      id: get_version
      run: |
        # Use release tag if available, else use branch name + short SHA
        echo "Extracting version from commit message"
        COMMIT_MSG=$(git log -1 --pretty=%B)
        echo "Commit message: $COMMIT_MSG"
        if [[ "$COMMIT_MSG" =~ v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
          VERSION="${BASH_REMATCH[0]}"
        else
          VERSION="${GITHUB_REF_NAME}-$(git rev-parse --short HEAD)"
        fi
        echo "VERSION=${VERSION}" >> $GITHUB_ENV
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

    # Step 3: Set up Helm
    - name: Set up Helm
      uses: azure/setup-helm@v4.2.0
      with:
        version: v3.14.4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        check-latest: true

    # Step 4: Update values with build version
    - name: Update Helm Values
      env:
        VERSION: ${{ env.VERSION }}
      run: |
        sed -i "s|version: .*|version: ${VERSION:1}|g" ${CHART_DIR}/Chart.yaml
        sed -i "s|appVersion: .*|appVersion: ${VERSION:1}|g" ${CHART_DIR}/Chart.yaml
        sed -i "s|udii05/colorflux-blue:.*|udii05/colorflux-blue:${VERSION}\"|g" ${CHART_DIR}/values.yaml
        sed -i "s|udii05/colorflux-red:.*|udii05/colorflux-red:${VERSION}\"|g" ${CHART_DIR}/values.yaml

    # Step 5: Helm Chart Testing
    - name: Helm Lint and Dry-Run
      continue-on-error: true
      run: |
        helm plugin install https://github.com/chartmuseum/helm-push || true
        helm lint ${CHART_DIR}
        helm template ${CHART_DIR}

    # Step 6: Create Helm Package
    - name: Create Helm Package
      run: |
        rm -rf charts/ || true
        helm package ${CHART_DIR} -d charts/

    # Step 7: Update Helm Repo Index
    - name: Update Helm Repo Index
      run: helm repo index charts/

    # Step 8: Push Helm Package to Repo
    - name: Push Helm Package to Repo
      # Private helm repository URL
      run: helm cm-push -f charts/colorflux-*.tgz http://148.113.13.149:9999